name: Sync upstream

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/codex-upstream-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: sync-upstream
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Merge latest upstream default branch
        run: |
          set -euo pipefail

          TARGET="${{ github.repository }}"
          TARGET_BRANCH="main"

          api_retry() {
            local max_attempts=6 attempt=1 delay=15 out rc
            while true; do
              if out=$("$@" 2>&1); then
                rc=0
              else
                rc=$?
              fi
              if [ "$rc" -eq 0 ]; then
                printf '%s' "$out"
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "ERROR: API call failed after $max_attempts attempts: $*" >&2
                printf '%s\n' "$out" >&2
                return "$rc"
              fi
              echo "WARN: API call failed (attempt $attempt/$max_attempts), retrying in ${delay}s: $*" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          metadata=$(api_retry gh api "repos/$TARGET")
          upstream=$(jq -er '.parent.full_name' <<< "$metadata") \
            || { echo "::error::Could not determine upstream repo for $TARGET (is it still a fork?)." >&2; exit 1; }
          source_branch=$(jq -er '.parent.default_branch' <<< "$metadata") \
            || { echo "::error::Could not determine upstream default branch for $upstream." >&2; exit 1; }
          echo "Source: $upstream ($source_branch)"
          echo "Target: $TARGET ($TARGET_BRANCH)"
          workdir=$(mktemp -d)
          cd "$workdir"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${TARGET}.git"
          git remote add upstream "https://github.com/${upstream}.git"
          git fetch -q origin "$TARGET_BRANCH"
          git fetch -q upstream "$source_branch"
          git checkout -q -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

          upstream_sha=$(git rev-parse "upstream/$source_branch")
          echo "Upstream commit: $upstream_sha"

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "Already up to date."
            behind_by=0
          else
            behind_by=$(git rev-list --count "HEAD..$upstream_sha")
            echo "Commits behind upstream: $behind_by"

            workflow_files=$(git diff --name-only "HEAD..$upstream_sha" -- '.github/workflows/' || true)
            if [ -n "$workflow_files" ]; then
              echo "Upstream touches workflow files; they will be excluded from the merge:"
              echo "$workflow_files"
              if ! git merge --no-commit "$upstream_sha"; then
                git merge --abort || true
                echo "::error::Merge conflict: upstream $upstream:$source_branch conflicts with local commits on $TARGET/$TARGET_BRANCH. Resolve it manually, then re-run this workflow." >&2
                exit 1
              fi
              git checkout HEAD -- .github/workflows/
              git commit -q --allow-empty -m "Sync upstream ${upstream}:${source_branch}"
            else
              if ! git merge -q "$upstream_sha" -m "Sync upstream ${upstream}:${source_branch}"; then
                echo "::error::Merge conflict: upstream $upstream:$source_branch conflicts with local commits on $TARGET/$TARGET_BRANCH. Resolve it manually, then re-run this workflow." >&2
                exit 1
              fi
            fi

            git push -q origin "$TARGET_BRANCH"
            echo "Merge pushed."
            git fetch -q origin "$TARGET_BRANCH"
            if ! git merge-base --is-ancestor "$upstream_sha" "origin/$TARGET_BRANCH"; then
              echo "::error::Sync verification failed: upstream commit not found on $TARGET/$TARGET_BRANCH after push." >&2
              exit 1
            fi
          fi

          {
            echo '### Upstream sync verified'
            echo "Source: $upstream ($source_branch)"
            echo "Target: $TARGET ($TARGET_BRANCH)"
            echo "Upstream commit: $upstream_sha"
            echo "New upstream commits merged: $behind_by"
            echo "Note: .github/workflows/ changes from upstream are skipped (kept our own)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream sync complete."
